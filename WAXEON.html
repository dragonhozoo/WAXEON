<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PurpleTalk - Firebase Hosting Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0b14; color: #e1d9f2; height: 100vh; display: flex; justify-content: center; align-items: center; }

    /* Latar Belakang & Modal Login */
    .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d0b14; display: flex; justify-content: center; align-items: center; z-index: 100; }
    .card-login { background: #161224; border: 1px solid #2e2447; border-radius: 12px; padding: 25px; width: 320px; text-align: center; box-shadow: 0 8px 24px rgba(110, 43, 222, 0.2); }
    .card-login h2 { color: #9d50bb; margin-bottom: 20px; }
    .avatar-preview { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #6e2bde; margin: 0 auto 15px; object-fit: cover; display: block; background: #261e38; }
    .input-field { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #2e2447; background: #0d0b14; color: #fff; outline: none; }
    .btn-purple { background: linear-gradient(135deg, #6e2bde, #9d50bb); border: none; color: #fff; padding: 10px 15px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-purple:hover { opacity: 0.9; }

    /* Layout Utama Web Chat */
    .app-container { display: none; width: 100%; height: 100vh; background: #120e1c; }
    .sidebar { width: 30%; background: #161224; border-right: 1px solid #2e2447; display: flex; flex-direction: column; }
    .main-chat { width: 70%; display: flex; flex-direction: column; background: #0d0b14; position: relative; }

    /* Header Sidebar & Profile */
    .user-header { padding: 15px; background: #1c172e; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2e2447; }
    .user-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #9d50bb; }
    .search-bar { padding: 10px; background: #161224; }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #231c36; cursor: pointer; }
    .chat-item:hover { background: #231c36; }
    .chat-item img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; object-fit: cover; }
    .chat-info h4 { font-size: 15px; color: #fff; }
    .chat-info p { font-size: 12px; color: #8c82a3; margin-top: 3px; }

    /* Main Chat Header & Body */
    .chat-header { padding: 15px; background: #161224; border-bottom: 1px solid #2e2447; display: flex; align-items: center; justify-content: space-between; }
    .chat-header .user-info { display: flex; align-items: center; }
    .chat-header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; object-fit: cover; }
    .actions button { background: none; border: none; color: #9d50bb; font-size: 18px; cursor: pointer; margin-left: 15px; }

    .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg-bubble { max-width: 60%; padding: 10px 14px; border-radius: 10px; font-size: 14px; position: relative; word-wrap: break-word; }
    .msg-bubble.sent { align-self: flex-end; background: #6e2bde; color: #fff; border-bottom-right-radius: 2px; }
    .msg-bubble.received { align-self: flex-start; background: #231c36; color: #e1d9f2; border-bottom-left-radius: 2px; }
    .msg-meta { font-size: 10px; margin-top: 4px; text-align: right; opacity: 0.8; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
    .msg-bubble img, .msg-bubble video { max-width: 100%; border-radius: 8px; margin-top: 5px; }

    /* Footer Input Chat */
    .chat-footer { padding: 12px; background: #161224; border-top: 1px solid #2e2447; display: flex; align-items: center; gap: 10px; }
    .chat-footer input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #2e2447; background: #0d0b14; color: #fff; outline: none; }
    .file-btn { color: #9d50bb; cursor: pointer; font-size: 20px; }

    /* Modal Video Call */
    .call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 11, 20, 0.95); z-index: 200; flex-direction: column; justify-content: center; align-items: center; }
    .video-container { display: flex; gap: 20px; margin-bottom: 20px; }
    .video-box { width: 300px; height: 220px; background: #161224; border: 2px solid #6e2bde; border-radius: 12px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .video-box video { width: 100%; height: 100%; object-fit: cover; }
    .btn-endcall { background: #e74c3c; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. HALAMAN LOGIN / UPLOAD PROFIL -->
  <div class="login-overlay" id="loginScreen">
    <div class="card-login">
      <h2>PurpleTalk</h2>
      <img id="avatarPreview" class="avatar-preview" src="https://via.placeholder.com/80/261e38/9d50bb?text=Foto" alt="Preview">
      <input type="file" id="inputPhoto" accept="image/*" style="display: none;" onchange="previewFile()">
      <button class="btn-purple" style="margin-bottom: 12px; background: #231c36;" onclick="document.getElementById('inputPhoto').click()">Upload Foto</button>
      <input type="text" id="inputName" class="input-field" placeholder="Masukkan Nama Anda...">
      <button class="btn-purple" onclick="loginUser()">Masuk Akun</button>
    </div>
  </div>

  <!-- 2. HALAMAN UTAMA WEB CHAT -->
  <div class="app-container" id="appContainer">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="user-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <img id="myAvatar" src="" alt="Profile">
          <b id="myProfileName" style="color: #fff;"></b>
        </div>
      </div>
      <!-- Fitur Pencarian Akun -->
      <div class="search-bar">
        <input type="text" id="searchInput" class="input-field" placeholder="🔍 Cari nama akun..." onkeyup="searchAccounts()">
      </div>
      <div class="chat-list" id="chatList">
        <!-- List Akun Terdaftar -->
      </div>
    </div>

    <!-- Main Chat Window -->
    <div class="main-chat">
      <div class="chat-header">
        <div class="user-info">
          <img id="activeChatAvatar" src="https://via.placeholder.com/40" alt="Active User">
          <div>
            <h4 id="activeChatName" style="color: #fff;">Pilih Chat</h4>
            <small id="activeChatStatus" style="color: #8c82a3;">Offline</small>
          </div>
        </div>
        <div class="actions">
          <button title="Panggilan Suara" onclick="startCall('voice')">📞</button>
          <button title="Video Call" onclick="startCall('video')">📹</button>
        </div>
      </div>

      <!-- Area Pesan -->
      <div class="messages-area" id="messagesArea"></div>

      <!-- Footer Kirim Pesan / Media -->
      <div class="chat-footer">
        <label class="file-btn" title="Kirim Foto/Video">
          📷
          <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="sendMedia(this)">
        </label>
        <input type="text" id="messageInput" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-purple" style="width: auto; padding: 10px 20px;" onclick="sendMessage()">Kirim</button>
      </div>
    </div>
  </div>

  <!-- 3. MODAL VIDEO CALL -->
  <div class="call-overlay" id="callOverlay">
    <h3 id="callTitle" style="color: #fff; margin-bottom: 15px;">Video Call...</h3>
    <div class="video-container">
      <div class="video-box"><video id="localVideo" autoplay muted></video></div>
      <div class="video-box"><video id="remoteVideo" autoplay></video></div>
    </div>
    <button class="btn-endcall" onclick="endCall()">Tutup Panggilan</button>
  </div>

  <!-- Firebase SDK v10 (ES Modules via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase Projek waxeon-28632
    const firebaseConfig = {
      apiKey: "AIzaSyBdmBLqdOA0CJ2QxU0BefEif511JYVP5uM",
      authDomain: "waxeon-28632.firebaseapp.com",
      projectId: "waxeon-28632",
      storageBucket: "waxeon-28632.firebasestorage.app",
      messagingSenderId: "1080220216624",
      appId: "1:1080220216624:web:83c57e36fb89b2f0f52cf5",
      measurementId: "G-3BE8ZFWD05"
    };

    // Inisialisasi Firebase & Analytics
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    // Database Akun Dummy
    const registeredUsers = [
      { id: 1, name: "Admin Utama", photo: "https://via.placeholder.com/80/6e2bde/fff?text=Admin", status: "online" },
      { id: 2, name: "Budi Santoso", photo: "https://via.placeholder.com/80/231c36/fff?text=Budi", status: "offline" },
      { id: 3, name: "Siti Rahma", photo: "https://via.placeholder.com/80/9d50bb/fff?text=Siti", status: "online" }
    ];

    let currentUser = null;
    let selectedChatUser = null;
    let localStream = null;

    // Window Functions agar dapat dipanggil dari HTML
    window.previewFile = function() {
      const file = document.getElementById('inputPhoto').files[0];
      const reader = new FileReader();
      reader.onloadend = function () {
        document.getElementById('avatarPreview').src = reader.result;
      }
      if (file) reader.readAsDataURL(file);
    };

    window.loginUser = function() {
      const name = document.getElementById('inputName').value.trim();
      const photoSrc = document.getElementById('avatarPreview').src;
      
      if (!name) return alert("Silakan masukkan nama akun!");

      currentUser = { name, photo: photoSrc };
      document.getElementById('myAvatar').src = photoSrc;
      document.getElementById('myProfileName').innerText = name;

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appContainer').style.display = 'flex';
      
      renderUsers(registeredUsers);
      listenRealtimeMessages();
    };

    function renderUsers(users) {
      const chatList = document.getElementById('chatList');
      chatList.innerHTML = '';
      users.forEach(user => {
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => selectUser(user);
        item.innerHTML = `
          <img src="${user.photo}" alt="${user.name}">
          <div class="chat-info">
            <h4>${user.name}</h4>
            <p style="color: ${user.status === 'online' ? '#2ecc71' : '#8c82a3'}">${user.status}</p>
          </div>
        `;
        chatList.appendChild(item);
      });
    }

    window.searchAccounts = function() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = registeredUsers.filter(u => u.name.toLowerCase().includes(query));
      renderUsers(filtered);
    };

    function selectUser(user) {
      selectedChatUser = user;
      document.getElementById('activeChatName').innerText = user.name;
      document.getElementById('activeChatAvatar').src = user.photo;
      document.getElementById('activeChatStatus').innerText = user.status === 'online' ? 'Online' : 'Offline';
      document.getElementById('messagesArea').innerHTML = '';
    }

    // Mendengarkan Pesan Realtime dari Firebase Realtime Database
    function listenRealtimeMessages() {
      const messagesRef = ref(db, 'messages');
      onChildAdded(messagesRef, (snapshot) => {
        const data = snapshot.val();
        const direction = (currentUser && data.sender === currentUser.name) ? 'sent' : 'received';
        appendMessage(data.content, data.type, direction, data.sender);
      });
    }

    window.sendMessage = function() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !selectedChatUser) return;

      const messagesRef = ref(db, 'messages');
      push(messagesRef, {
        sender: currentUser.name,
        receiver: selectedChatUser.name,
        content: text,
        type: 'text',
        timestamp: Date.now()
      });

      input.value = '';
    };

    window.sendMedia = function(element) {
      const file = element.files[0];
      if (!file || !selectedChatUser) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const msgType = file.type.startsWith('video') ? 'video' : 'image';
        const messagesRef = ref(db, 'messages');
        push(messagesRef, {
          sender: currentUser.name,
          receiver: selectedChatUser.name,
          content: e.target.result,
          type: msgType,
          timestamp: Date.now()
        });
      };
      reader.readAsDataURL(file);
    };

    function appendMessage(content, type, direction, sender) {
      const area = document.getElementById('messagesArea');
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${direction}`;

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      let checkmark = '';
      if (direction === 'sent') {
        checkmark = '<span style="color: #3498db;">✔️✔️</span>';
      }

      let innerHTML = `<small style="color: #9d50bb; font-size:10px; display:block;">${sender}</small>`;
      if (type === 'text') innerHTML += `<div>${content}</div>`;
      else if (type === 'image') innerHTML += `<img src="${content}" />`;
      else if (type === 'video') innerHTML += `<video src="${content}" controls></video>`;

      innerHTML += `<div class="msg-meta"><span>${timeStr}</span> ${checkmark}</div>`;
      bubble.innerHTML = innerHTML;

      area.appendChild(bubble);
      area.scrollTop = area.scrollHeight;
    }

    // Video Call
    window.startCall = async function(type) {
      if (!selectedChatUser) return alert("Pilih akun untuk ditelpon!");
      document.getElementById('callOverlay').style.display = 'flex';
      document.getElementById('callTitle').innerText = `${type === 'video' ? 'Video' : 'Voice'} Call dengan ${selectedChatUser.name}...`;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: type === 'video', 
          audio: true 
        });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (err) {
        console.error("Gagal mengakses media:", err);
      }
    };

    window.endCall = function() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('callOverlay').style.display = 'none';
    };
  </script>
</body>
</html>
